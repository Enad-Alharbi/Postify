<app-confirm-dialog
  title="Delete Post?"
  message="Are you sure you want to delete this post? This action cannot be undone."
  confirmLabel="Yes, Delete Post"
  [loading]="deleting()"
  [error]="error()"
  (confirmed)="confirm()"
  (cancelled)="close()"
>
  <div class="delete-preview">
    <img [src]="imageUrl()" alt="" />
    <span>{{ captionPreview() }}</span>
  </div>
</app-confirm-dialog>
