<header class="app-header">
  <div class="header-inner">
    <app-logo />

    <nav class="desktop-nav" aria-label="Primary">
      <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <app-icon name="home" />Home
      </a>
      <a class="nav-link" routerLink="/profile" routerLinkActive="active"><app-icon name="user" />Profile</a>
    </nav>

    <div class="header-user">
      @if (auth.currentUser(); as user) {
        <a class="identity" routerLink="/profile">
          <app-my-avatar size="sm" />
          <span>
            <strong>{{ user.firstName }} {{ user.lastName }}</strong>
            <small>{{ '@' + user.userName }}</small>
          </span>
        </a>
      }
      <button type="button" class="icon-button logout" (click)="auth.logout()" aria-label="Log out">
        <app-icon name="logout" />
      </button>
    </div>
  </div>
</header>

<nav class="mobile-nav" aria-label="Mobile navigation">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <app-icon name="home" /><span>Home</span>
  </a>
  <button type="button" (click)="createPost.show()">
    <span class="mobile-create"><app-icon name="plus" /></span><span>Create</span>
  </button>
  <a routerLink="/profile" routerLinkActive="active"><app-icon name="user" /><span>Profile</span></a>
</nav>
